<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>四象限任务管理</title>
<style>
:root {
  --bg: #f5f6f8;
  --panel: #ffffff;
  --ink: #1f2329;
  --muted: #8a9099;
  --line: #e7e9ee;
  --q1: #f5605f;
  --q2: #3b82f6;
  --q3: #f59e0b;
  --q4: #9aa3af;
  --ok: #22c55e;
  --shadow: 0 2px 8px rgba(20, 30, 50, 0.08);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* 顶栏 */
.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 16px; background: var(--panel);
  border-bottom: 1px solid var(--line); flex-wrap: wrap;
}
.brand { font-weight: 700; font-size: 16px; white-space: nowrap; }
.view-toggle { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.view-toggle button {
  border: none; background: transparent; padding: 7px 14px; cursor: pointer; font-size: 13px; color: var(--muted);
}
.view-toggle button.active { background: var(--ink); color: #fff; }
.top-actions { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; align-items: center; }
.top-actions input.search, .top-actions select.filter {
  padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; background: #fff;
}
.top-actions input.search { width: 180px; }
.top-actions button {
  padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; font-size: 13px;
}
.top-actions button:hover { border-color: #c9cdd4; }

/* 快速添加 */
.quick-add { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.qa-hint { font-size: 12px; color: var(--muted); white-space: nowrap; }
.quick-add input { flex: 1; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
.quick-add button { padding: 9px 18px; border: none; border-radius: 8px; background: var(--ink); color: #fff; cursor: pointer; font-size: 14px; }

/* 看板 */
.kanban { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 14px; overflow: auto; }
.column { background: #eef0f4; border-radius: 12px; display: flex; flex-direction: column; min-height: 0; border-top: 4px solid var(--q4); }
.column.q1 { border-top-color: var(--q1); }
.column.q2 { border-top-color: var(--q2); }
.column.q3 { border-top-color: var(--q3); }
.column.q4 { border-top-color: var(--q4); }
.col-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; font-weight: 600; font-size: 13px; }
.col-count { background: #fff; border-radius: 20px; padding: 1px 9px; font-size: 12px; color: var(--muted); }
.col-list { flex: 1; overflow: auto; padding: 4px 10px 10px; display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
.col-list.drag-over { background: rgba(59,130,246,0.08); border-radius: 8px; outline: 2px dashed #9cc4ff; }
.col-foot { padding: 8px 10px; display: flex; gap: 6px; }
.col-foot input { flex: 1; border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; font-size: 12px; }
.col-foot button { border: none; background: #fff; border-radius: 7px; width: 30px; cursor: pointer; font-size: 16px; }

/* 卡片 */
.card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; box-shadow: var(--shadow); cursor: grab; position: relative; }
.card.dragging { opacity: 0.5; }
.card.done { opacity: 0.55; background: #fafafa; }
.card.done .card-title { text-decoration: line-through; color: var(--muted); }
.card-top { display: flex; align-items: flex-start; gap: 8px; }
.card-check { margin-top: 2px; width: 16px; height: 16px; cursor: pointer; }
.card-title { font-size: 13.5px; line-height: 1.45; flex: 1; word-break: break-word; }
.card-note { font-size: 12px; color: var(--muted); margin: 4px 0 0 24px; white-space: pre-wrap; word-break: break-word; }
.card-sub { margin: 6px 0 0 24px; display: flex; flex-direction: column; gap: 3px; }
.sub-item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.sub-item input { width: 13px; height: 13px; }
.sub-item.done span { text-decoration: line-through; color: var(--muted); }
.sub-add { display: flex; gap: 4px; margin-top: 4px; }
.sub-add input { flex: 1; border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font-size: 12px; }
.sub-add button { border: none; background: #eef0f4; border-radius: 6px; padding: 3px 8px; cursor: pointer; font-size: 12px; }
.card-actions { display: flex; gap: 8px; margin: 7px 0 0 24px; }
.card-actions button { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; padding: 0; }
.card-actions button:hover { color: var(--ink); }
.sub-toggle { font-size: 11px; color: var(--q2); cursor: pointer; user-select: none; margin-left: 6px; }
.sub-progress { font-size: 11px; color: var(--muted); }

/* 列表视图 */
.list { flex: 1; overflow: auto; padding: 14px 16px; }
.list table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); }
.list th, .list td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
.list th { background: #f0f2f5; font-weight: 600; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 20px; font-size: 11px; color: #fff; }
.tag.q1 { background: var(--q1); } .tag.q2 { background: var(--q2); } .tag.q3 { background: var(--q3); } .tag.q4 { background: var(--q4); }
.list .row-actions button { border: none; background: transparent; color: #5b8def; cursor: pointer; margin-right: 8px; font-size: 12px; }

/* 弹窗 */
.modal { position: fixed; inset: 0; background: rgba(20,28,45,0.42); display: flex; align-items: center; justify-content: center; z-index: 50; }
.modal.hidden, .hidden { display: none !important; }
.modal-box { background: #fff; border-radius: 14px; width: min(860px, 94vw); max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal-head h3 { margin: 0; font-size: 16px; }
.modal-head .x { border: none; background: transparent; font-size: 18px; cursor: pointer; color: var(--muted); }
.modal-body { padding: 16px 18px; overflow: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding-top: 12px; }
.modal-foot button, .modal-body button.primary { padding: 8px 16px; border: none; border-radius: 8px; background: var(--ink); color: #fff; cursor: pointer; }
.set-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); }
.set-row.col { flex-direction: column; align-items: stretch; gap: 6px; }
.set-row.col input, .set-row.col textarea { border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 13px; font-family: inherit; }
.hint { font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.6; }

/* 统计 */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
.stat-card { background: #f6f8fb; border-radius: 10px; padding: 12px; text-align: center; }
.stat-card .num { font-size: 22px; font-weight: 700; }
.stat-card .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }
.chart-title { font-size: 14px; font-weight: 600; margin: 14px 0 8px; }
.donut-wrap { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.donut { width: 150px; height: 150px; border-radius: 50%; }
.legend { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend .dot { width: 12px; height: 12px; border-radius: 3px; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 160px; padding: 10px 4px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.bar-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-width: 34px; flex: 1; }
.bar { width: 22px; background: linear-gradient(180deg, #6aa6ff, #3b82f6); border-radius: 4px 4px 0 0; }
.bar-label { font-size: 10px; color: var(--muted); margin-top: 4px; }
.stat-actions { display: flex; gap: 10px; margin-top: 16px; }
.stat-actions button { padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; font-size: 13px; }
.recycle-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
.recycle-item .meta { font-size: 12px; color: var(--muted); }
.recycle-item button { padding: 5px 12px; border: none; background: var(--ok); color: #fff; border-radius: 7px; cursor: pointer; }
.empty { color: var(--muted); text-align: center; padding: 24px; font-size: 13px; }

/* toast */
.toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); background: #1f2329; color: #fff; padding: 11px 20px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow); z-index: 80; }
@media (max-width: 820px) { .kanban { grid-template-columns: 1fr 1fr; } .stat-grid { grid-template-columns: 1fr 1fr; } }

</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">🎯 四象限任务管理</div>
    <div class="view-toggle">
      <button id="btnKanban" class="active">看板模式</button>
      <button id="btnList">列表模式</button>
    </div>
    <div class="top-actions">
      <input id="searchBox" class="search" type="text" placeholder="搜索任务关键词…" />
      <select id="filterSel" class="filter">
        <option value="all">全部</option>
        <option value="undone">未完成</option>
        <option value="done">已完成</option>
        <option value="q1">仅 Q1 重要且紧急</option>
        <option value="q2">仅 Q2 重要不紧急</option>
        <option value="q3">仅 Q3 紧急不重要</option>
        <option value="q4">仅 Q4 既不重要也不紧急</option>
      </select>
      <button id="btnStats">📊 统计报表</button>
      <button id="btnRecycle">🗑 回收站</button>
      <button id="btnSettings">⚙ 设置</button>
      <button id="btnBackup">💾 备份</button>
    </div>
  </header>

  <section class="quick-add">
    <span class="qa-hint">快速添加（默认放入 Q4，可拖拽调整）</span>
    <input id="quickAddInput" type="text" placeholder="输入任务标题，回车或点击添加…" />
    <button id="btnQuickAdd">添加</button>
  </section>

  <main id="kanbanView" class="kanban"></main>
  <main id="listView" class="list hidden"></main>

  <!-- 统计报表弹窗 -->
  <div id="statsModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head"><h3>📊 统计报表</h3><button class="x" data-close>✕</button></div>
      <div class="modal-body" id="statsBody"></div>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head"><h3>⚙ 设置 · 每日定时唤起</h3><button class="x" data-close>✕</button></div>
      <div class="modal-body">
        <label class="set-row">
          <span>启用定时唤起</span>
          <input type="checkbox" id="setTimerOn" />
        </label>
        <label class="set-row">
          <span>唤起时间</span>
          <input type="time" id="setTimerTime" value="08:50" />
        </label>
        <label class="set-row">
          <span>浏览器桌面通知</span>
          <input type="checkbox" id="setNotify" />
        </label>
        <p class="hint">说明：纯前端应用在页面保持打开时，到点（默认 8:50）会自动切换到任务面板并轻提示，不弹强制窗、不打扰。若需关闭浏览器后仍自动唤起，需配合系统级计划任务/扩展。</p>
      </div>
    </div>
  </div>

  <!-- 回收站弹窗 -->
  <div id="recycleModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head"><h3>🗑 回收站（误删可恢复）</h3><button class="x" data-close>✕</button></div>
      <div class="modal-body" id="recycleBody"></div>
    </div>
  </div>

  <!-- 编辑弹窗 -->
  <div id="editModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head"><h3>✏ 编辑任务</h3><button class="x" data-close>✕</button></div>
      <div class="modal-body">
        <label class="set-row col"><span>标题</span><input type="text" id="editTitle" /></label>
        <label class="set-row col"><span>备注</span><textarea id="editNote" rows="4"></textarea></label>
        <div class="modal-foot">
          <button id="editSave" class="primary">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 隐藏的文件导入 -->
  <input type="file" id="importFile" accept="application/json" class="hidden" />

  <div id="toast" class="toast hidden"></div>

  <script>
/* ============ 四象限任务管理 · 核心逻辑 ============ */
'use strict';

const QUADRANTS = {
  1: { name: 'Q1 重要且紧急', desc: '立即处理', color: '#f5605f' },
  2: { name: 'Q2 重要不紧急', desc: '计划安排', color: '#3b82f6' },
  3: { name: 'Q3 紧急不重要', desc: '委托他人', color: '#f59e0b' },
  4: { name: 'Q4 既不重要也不紧急', desc: '减少/删除', color: '#9aa3af' },
};

/* ---------- 存储 ---------- */
const LS = {
  tasks: 'eq_tasks_v1',
  logs: 'eq_logs_v1',
  deleted: 'eq_deleted_v1',
  settings: 'eq_settings_v1',
};
function load(key, def) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? def : v; }
  catch (e) { return def; }
}
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

let tasks = load(LS.tasks, []);
let logs = load(LS.logs, []);
let deleted = load(LS.deleted, []);
let settings = load(LS.settings, { timerEnabled: false, timerTime: '08:50', notify: false });
let currentView = 'kanban';
let editId = null;
let dragId = null;
let lastFired = '';

/* ---------- 工具 ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const $ = (id) => document.getElementById(id);
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtDate(ts) { const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }

function log(action, detail) {
  logs.unshift({ id: uid(), time: Date.now(), action, detail });
  logs = logs.slice(0, 500);
  save(LS.logs, logs);
  scheduleSync();
}
function saveTasks() { save(LS.tasks, tasks); scheduleSync(); }

/* ---------- 任务操作 ---------- */
function addTask(title, note, quadrant) {
  title = (title || '').trim();
  if (!title) return;
  const q = quadrant || 4; // 默认 Q4
  const order = tasks.filter((t) => t.quadrant === q).length;
  const t = { id: uid(), title, note: note || '', quadrant: q, done: false, order, createdAt: Date.now(), updatedAt: Date.now(), completedAt: null, subtasks: [] };
  tasks.push(t);
  saveTasks();
  log('add', `新增任务「${title}」→ ${QUADRANTS[q].name}`);
}
function getTask(id) { return tasks.find((t) => t.id === id); }
function updateTask(id, patch) { const t = getTask(id); if (!t) return; Object.assign(t, patch); t.updatedAt = Date.now(); saveTasks(); }
function deleteTask(id) {
  const i = tasks.findIndex((t) => t.id === id);
  if (i < 0) return;
  const [t] = tasks.splice(i, 1);
  t.deletedAt = Date.now();
  t.updatedAt = Date.now();
  deleted.unshift(t);
  deleted = deleted.slice(0, 100);
  saveTasks(); save(LS.deleted, deleted); scheduleSync();
  log('delete', `删除任务「${t.title}」`);
}
function restoreTask(id) {
  const i = deleted.findIndex((t) => t.id === id);
  if (i < 0) return;
  const [t] = deleted.splice(i, 1);
  delete t.deletedAt;
  tasks.push(t);
  t.updatedAt = Date.now();
  saveTasks(); save(LS.deleted, deleted); scheduleSync();
  log('restore', `恢复任务「${t.title}」`);
}
function toggleDone(id) {
  const t = getTask(id); if (!t) return;
  t.done = !t.done;
  t.completedAt = t.done ? Date.now() : null;
  t.updatedAt = Date.now();
  saveTasks();
  log('done', `${t.done ? '完成' : '撤销完成'}任务「${t.title}」`);
}
function addSubtask(taskId, title) {
  const t = getTask(taskId); if (!t) return;
  title = (title || '').trim(); if (!title) return;
  t.subtasks = t.subtasks || [];
  t.subtasks.push({ id: uid(), title, done: false });
  t.updatedAt = Date.now();
  saveTasks();
  log('subtask', `任务「${t.title}」新增子任务「${title}」`);
}
function toggleSubtask(taskId, subId) {
  const t = getTask(taskId); if (!t) return;
  const s = (t.subtasks || []).find((x) => x.id === subId); if (!s) return;
  s.done = !s.done; t.updatedAt = Date.now(); saveTasks();
}

/* ---------- 多端同步（轻后端，自动探测） ---------- */
const SYNC = { enabled: false, timer: null, _d: null };
const SYNC_TOKEN = (() => {
  try {
    const fromUrl = new URLSearchParams(location.search).get('token');
    if (fromUrl) { localStorage.setItem('eq_sync_token', fromUrl); return fromUrl; }
    return localStorage.getItem('eq_sync_token') || '';
  } catch (e) { return ''; }
})();
function withToken(u) {
  if (!SYNC_TOKEN) return u;
  return u + (u.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(SYNC_TOKEN);
}
function ensureRev(o) { if (!o.updatedAt) o.updatedAt = o.createdAt || o.completedAt || Date.now(); }
function ensureAllRev() { tasks.forEach(ensureRev); deleted.forEach(ensureRev); logs.forEach(ensureRev); }
function mergeEntity(a, b) { if (!a) return b; if (!b) return a; return (b.updatedAt > a.updatedAt) ? b : a; }
function scheduleSync() {
  if (!SYNC.enabled) return;
  clearTimeout(SYNC._d);
  SYNC._d = setTimeout(pushPull, 500);
}
async function pushPull() {
  if (!SYNC.enabled) return;
  try {
    const res = await fetch(withToken('api/state'), { cache: 'no-store' });
    if (!res.ok) return;
    const remote = await res.json().catch(() => ({}));
    ensureAllRev();
    const sig = () => JSON.stringify({
      t: tasks.map((x) => [x.id, x.updatedAt]).sort(),
      d: deleted.map((x) => [x.id, x.updatedAt]).sort(),
      l: logs.map((x) => x.id).sort(),
    });
    const before = sig();
    const map = {}; tasks.forEach((t) => (map[t.id] = t));
    (remote.tasks || []).forEach((t) => { const w = mergeEntity(map[t.id], t); if (w) map[w.id] = w; });
    tasks = Object.values(map);
    const mapD = {}; deleted.forEach((t) => (mapD[t.id] = t));
    (remote.deleted || []).forEach((t) => { const w = mergeEntity(mapD[t.id], t); if (w) mapD[w.id] = w; });
    deleted = Object.values(mapD);
    const mapL = {}; logs.forEach((l) => (mapL[l.id] = l));
    (remote.logs || []).forEach((l) => (mapL[l.id] = l));
    logs = Object.values(mapL);
    if (before !== sig()) {
      saveTasks(); save(LS.logs, logs); save(LS.deleted, deleted);
      await fetch(withToken('api/state'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tasks, logs, deleted }) }).catch(() => {});
      render();
    }
  } catch (e) { /* 离线或后端不可用，忽略 */ }
}
async function detectSync() {
  try {
    const r = await fetch(withToken('api/ping'), { cache: 'no-store' });
    if (r.ok) { SYNC.enabled = true; ensureAllRev(); await pushPull(); SYNC.timer = setInterval(pushPull, 15000); toast('已连接同步服务，多端数据将自动同步'); }
  } catch (e) { SYNC.enabled = false; }
}

/* ---------- 视图渲染 ---------- */
function render() {
  if (currentView === 'kanban') renderKanban(); else renderList();
}

function renderKanban() {
  const view = $('kanbanView');
  view.innerHTML = '';
  [1, 2, 3, 4].forEach((q) => {
    const qTasks = tasks.filter((t) => t.quadrant === q).sort((a, b) => a.order - b.order);
    const col = document.createElement('div');
    col.className = `column q${q}`;
    col.innerHTML = `<div class="col-head"><span>${QUADRANTS[q].name}</span><span class="col-count">${qTasks.length}</span></div>`;
    const listEl = document.createElement('div');
    listEl.className = 'col-list';
    listEl.dataset.quadrant = q;
    qTasks.forEach((t) => listEl.appendChild(renderCard(t)));
    listEl.addEventListener('dragover', (e) => { e.preventDefault(); listEl.classList.add('drag-over'); });
    listEl.addEventListener('dragleave', () => listEl.classList.remove('drag-over'));
    listEl.addEventListener('drop', (e) => { e.preventDefault(); listEl.classList.remove('drag-over'); handleDrop(e, q); });
    col.appendChild(listEl);
    const foot = document.createElement('div');
    foot.className = 'col-foot';
    foot.innerHTML = `<input placeholder="添加到此象限…" data-q="${q}" /><button data-q="${q}">+</button>`;
    foot.querySelector('button').addEventListener('click', () => {
      const inp = foot.querySelector('input'); addTask(inp.value, '', q); inp.value = ''; render();
    });
    foot.querySelector('input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { addTask(e.target.value, '', q); e.target.value = ''; render(); }
    });
    col.appendChild(foot);
    view.appendChild(col);
  });
}

function renderCard(t) {
  const card = document.createElement('div');
  card.className = 'card' + (t.done ? ' done' : '');
  card.draggable = true;
  card.dataset.id = t.id;
  const subs = t.subtasks || [];
  const doneSubs = subs.filter((s) => s.done).length;
  card.innerHTML = `
    <div class="card-top">
      <input type="checkbox" class="card-check" ${t.done ? 'checked' : ''} />
      <div class="card-title">${esc(t.title)}</div>
    </div>
    ${t.note ? `<div class="card-note">${esc(t.note)}</div>` : ''}
    <div class="card-actions">
      <span class="sub-toggle">${subs.length ? `子任务 ${doneSubs}/${subs.length}` : '＋子任务'}</span>
      <button data-act="edit">编辑</button>
      <button data-act="del">删除</button>
    </div>
    <div class="card-sub hidden"></div>`;
  // 完成
  card.querySelector('.card-check').addEventListener('click', (e) => { e.stopPropagation(); toggleDone(t.id); render(); });
  // 编辑/删除
  card.querySelector('[data-act="edit"]').addEventListener('click', (e) => { e.stopPropagation(); openEdit(t.id); });
  card.querySelector('[data-act="del"]').addEventListener('click', (e) => { e.stopPropagation(); deleteTask(t.id); render(); });
  // 子任务区
  const subWrap = card.querySelector('.card-sub');
  const toggle = card.querySelector('.sub-toggle');
  function fillSubs() {
    subWrap.innerHTML = '';
    (t.subtasks || []).forEach((s) => {
      const row = document.createElement('div');
      row.className = 'sub-item' + (s.done ? ' done' : '');
      row.innerHTML = `<input type="checkbox" ${s.done ? 'checked' : ''} /><span>${esc(s.title)}</span>`;
      row.querySelector('input').addEventListener('click', (e) => { e.stopPropagation(); toggleSubtask(t.id, s.id); render(); });
      subWrap.appendChild(row);
    });
    const add = document.createElement('div');
    add.className = 'sub-add';
    add.innerHTML = `<input placeholder="新增子任务…" /><button>＋</button>`;
    add.querySelector('button').addEventListener('click', () => { addSubtask(t.id, add.querySelector('input').value); render(); });
    add.querySelector('input').addEventListener('keydown', (e) => { if (e.key === 'Enter') { addSubtask(t.id, e.target.value); render(); } });
    subWrap.appendChild(add);
  }
  toggle.addEventListener('click', (e) => { e.stopPropagation(); subWrap.classList.toggle('hidden'); if (!subWrap.classList.contains('hidden')) fillSubs(); });
  // 拖拽
  card.addEventListener('dragstart', (e) => { dragId = t.id; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', t.id); card.classList.add('dragging'); });
  card.addEventListener('dragend', () => card.classList.remove('dragging'));
  return card;
}

function getDragAfterElement(container, y) {
  const els = [...container.querySelectorAll('.card:not(.dragging)')];
  let closest = { offset: -Infinity, element: null };
  for (const el of els) {
    const box = el.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) closest = { offset, element: el };
  }
  return closest.element;
}

function handleDrop(e, targetQ) {
  const id = dragId || e.dataTransfer.getData('text/plain');
  const dragged = getTask(id); if (!dragged) return;
  const listEl = e.currentTarget;
  const afterEl = getDragAfterElement(listEl, e.clientY);
  const afterId = afterEl ? afterEl.dataset.id : null;
  dragged.quadrant = targetQ;
  let qTasks = tasks.filter((t) => t.quadrant === targetQ && t.id !== id);
  let idx = qTasks.length;
  if (afterId) { const i = qTasks.findIndex((t) => t.id === afterId); if (i >= 0) idx = i; }
  qTasks.splice(idx, 0, dragged);
  qTasks.forEach((t, i) => (t.order = i));
  saveTasks();
  const moved = dragged.quadrant === targetQ ? '调整顺序' : `移动至 ${QUADRANTS[targetQ].name}`;
  log('move', `任务「${dragged.title}」${moved}`);
  render();
}

/* ---------- 列表视图 ---------- */
function renderList() {
  const view = $('listView');
  let list = tasks.slice();
  const f = $('filterSel').value;
  const s = $('searchBox').value.trim().toLowerCase();
  if (f === 'done') list = list.filter((t) => t.done);
  else if (f === 'undone') list = list.filter((t) => !t.done);
  else if (['q1', 'q2', 'q3', 'q4'].includes(f)) list = list.filter((t) => String(t.quadrant) === f.slice(1));
  if (s) list = list.filter((t) => t.title.toLowerCase().includes(s) || (t.note || '').toLowerCase().includes(s));
  list.sort((a, b) => a.quadrant - b.quadrant || a.order - b.order);

  if (!list.length) { view.innerHTML = '<div class="empty">暂无匹配任务</div>'; return; }
  const rows = list.map((t) => {
    const subs = t.subtasks || [];
    const doneSubs = subs.filter((s) => s.done).length;
    return `<tr>
      <td><input type="checkbox" ${t.done ? 'checked' : ''} data-done="${t.id}" /></td>
      <td>${esc(t.title)}${t.note ? `<div style="color:#8a9099;font-size:12px">${esc(t.note)}</div>` : ''}</td>
      <td><span class="tag q${t.quadrant}">${QUADRANTS[t.quadrant].name}</span></td>
      <td>${subs.length ? `${doneSubs}/${subs.length}` : '—'}</td>
      <td>${t.done ? fmtDate(t.completedAt) : '进行中'}</td>
      <td class="row-actions">
        <button data-edit="${t.id}">编辑</button>
        <button data-del="${t.id}">删除</button>
      </td>
    </tr>`;
  }).join('');
  view.innerHTML = `<table>
    <thead><tr><th>完成</th><th>标题 / 备注</th><th>象限</th><th>子任务</th><th>完成时间</th><th>操作</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
  view.querySelectorAll('[data-done]').forEach((c) => c.addEventListener('click', () => { toggleDone(c.dataset.done); render(); }));
  view.querySelectorAll('[data-edit]').forEach((c) => c.addEventListener('click', () => openEdit(c.dataset.edit)));
  view.querySelectorAll('[data-del]').forEach((c) => c.addEventListener('click', () => { deleteTask(c.dataset.del); render(); }));
}

/* ---------- 统计报表 ---------- */
function computeStats() {
  const total = tasks.length;
  const doneTotal = tasks.filter((t) => t.done).length;
  const undoneTotal = total - doneTotal;
  const qCount = { 1: 0, 2: 0, 3: 0, 4: 0 };
  tasks.forEach((t) => (qCount[t.quadrant]++));

  // 按天聚合（createdAt）
  const byDay = {};
  tasks.forEach((t) => {
    const d = fmtDate(t.createdAt);
    if (!byDay[d]) byDay[d] = { total: 0, done: 0, undone: 0, q: { 1: 0, 2: 0, 3: 0, 4: 0 } };
    byDay[d].total++;
    if (t.done) byDay[d].done++; else byDay[d].undone++;
    byDay[d].q[t.quadrant]++;
  });
  const dayKeys = Object.keys(byDay).sort();
  const last14 = dayKeys.slice(-14);

  // 本周（周一为起点）
  const now = new Date();
  const monday = new Date(now); monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  monday.setHours(0, 0, 0, 0);
  const weekTasks = tasks.filter((t) => t.createdAt >= monday.getTime());
  const weekTotal = weekTasks.length;
  const weekDone = weekTasks.filter((t) => t.done).length;

  return { total, doneTotal, undoneTotal, qCount, byDay, last14, weekTotal, weekDone };
}

function renderStats() {
  const s = computeStats();
  const body = $('statsBody');
  const maxDay = Math.max(1, ...s.last14.map((d) => s.byDay[d].total));
  const bars = s.last14.map((d) => {
    const v = s.byDay[d];
    const h = Math.round((v.total / maxDay) * 130) + 2;
    return `<div class="bar-col"><div class="bar" style="height:${h}px" title="共${v.total} 完成${v.done}"></div><div class="bar-label">${d.slice(5)}</div></div>`;
  }).join('');

  // 甜甜圈（conic-gradient）
  const segs = [1, 2, 3, 4].filter((q) => s.qCount[q] > 0);
  let gradient = 'conic-gradient(#eee 0 100%)';
  if (segs.length) {
    let acc = 0; const parts = [];
    segs.forEach((q) => {
      const start = (acc / s.total) * 100;
      acc += s.qCount[q];
      const end = (acc / s.total) * 100;
      parts.push(`${QUADRANTS[q].color} ${start}% ${end}%`);
    });
    gradient = `conic-gradient(${parts.join(',')})`;
  }
  const legend = [1, 2, 3, 4].map((q) =>
    `<div><span class="dot" style="background:${QUADRANTS[q].color}"></span>${QUADRANTS[q].name}：${s.qCount[q]}</div>`
  ).join('');

  body.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="num">${s.total}</div><div class="lbl">任务总量</div></div>
      <div class="stat-card"><div class="num" style="color:var(--ok)">${s.doneTotal}</div><div class="lbl">已完成</div></div>
      <div class="stat-card"><div class="num" style="color:#f5605f">${s.undoneTotal}</div><div class="lbl">未完成</div></div>
      <div class="stat-card"><div class="num">${s.weekTotal}</div><div class="lbl">本周新增（完成 ${s.weekDone}）</div></div>
    </div>
    <div class="chart-title">四象限分布占比</div>
    <div class="donut-wrap">
      <div class="donut" style="background:${gradient}"></div>
      <div class="legend">${legend}</div>
    </div>
    <div class="chart-title">每日任务量（最近 ${s.last14.length} 天，按创建日聚合）</div>
    <div class="bars">${bars || '<div class="empty">暂无数据</div>'}</div>
    <div class="stat-actions">
      <button id="expDaily">导出每日统计 CSV</button>
      <button id="expTasks">导出全部任务 CSV</button>
    </div>`;
  $('expDaily').addEventListener('click', exportDailyCSV);
  $('expTasks').addEventListener('click', exportTasksCSV);
  openModal('statsModal');
}

function exportDailyCSV() {
  const s = computeStats();
  const head = ['日期', '任务总量', '已完成', '未完成', 'Q1', 'Q2', 'Q3', 'Q4'];
  const lines = [head.join(',')];
  Object.keys(s.byDay).sort().forEach((d) => {
    const v = s.byDay[d];
    lines.push([d, v.total, v.done, v.undone, v.q[1], v.q[2], v.q[3], v.q[4]].join(','));
  });
  download('四象限_每日统计.csv', lines.join('\n'));
  toast('已导出每日统计 CSV');
}
function exportTasksCSV() {
  const head = ['创建日期', '标题', '象限', '完成状态', '完成日期', '子任务数', '已完成子任务', '备注'];
  const lines = [head.join(',')];
  tasks.slice().sort((a, b) => a.quadrant - b.quadrant).forEach((t) => {
    const subs = t.subtasks || [];
    lines.push([
      fmtDate(t.createdAt),
      `"${String(t.title).replace(/"/g, '""')}"`,
      QUADRANTS[t.quadrant].name,
      t.done ? '已完成' : '未完成',
      t.done ? fmtDate(t.completedAt) : '',
      subs.length, subs.filter((s) => s.done).length,
      `"${String(t.note || '').replace(/"/g, '""')}"`,
    ].join(','));
  });
  download('四象限_全部任务.csv', lines.join('\n'));
  toast('已导出全部任务 CSV');
}
function download(name, content) {
  const blob = new Blob(['﻿' + content], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  URL.revokeObjectURL(a.href);
}

/* ---------- 回收站 ---------- */
function renderRecycle() {
  const body = $('recycleBody');
  if (!deleted.length) { body.innerHTML = '<div class="empty">回收站为空</div>'; openModal('recycleModal'); return; }
  body.innerHTML = deleted.map((t) => `
    <div class="recycle-item">
      <div>
        <div>${esc(t.title)} <span class="tag q${t.quadrant}">${QUADRANTS[t.quadrant].name}</span></div>
        <div class="meta">删除于 ${fmtDate(t.deletedAt)}</div>
      </div>
      <button data-restore="${t.id}">恢复</button>
    </div>`).join('');
  body.querySelectorAll('[data-restore]').forEach((b) => b.addEventListener('click', () => { restoreTask(b.dataset.restore); renderRecycle(); render(); }));
  openModal('recycleModal');
}

/* ---------- 编辑弹窗 ---------- */
function openEdit(id) {
  const t = getTask(id); if (!t) return;
  editId = id;
  $('editTitle').value = t.title;
  $('editNote').value = t.note || '';
  openModal('editModal');
}
function saveEdit() {
  if (!editId) return;
  const title = $('editTitle').value.trim();
  if (!title) { toast('标题不能为空'); return; }
  updateTask(editId, { title, note: $('editNote').value });
  log('edit', `编辑任务「${title}」`);
  closeModals(); render();
}

/* ---------- 备份 ---------- */
function exportBackup() {
  const data = { tasks, logs, deleted, settings, exportedAt: Date.now() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `四象限备份_${fmtDate(Date.now())}.json`; a.click();
  URL.revokeObjectURL(a.href);
  toast('已备份全部数据');
}
function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (d.tasks) { tasks = d.tasks; saveTasks(); }
      if (d.logs) { logs = d.logs; save(LS.logs, logs); }
      if (d.deleted) { deleted = d.deleted; save(LS.deleted, deleted); }
      if (d.settings) { settings = d.settings; save(LS.settings, settings); syncSettings(); }
      render(); toast('已从备份恢复');
    } catch (e) { toast('备份文件解析失败'); }
  };
  reader.readAsText(file);
}

/* ---------- 弹窗/提示 ---------- */
function openModal(id) { $(id).classList.remove('hidden'); }
function closeModals() { document.querySelectorAll('.modal').forEach((m) => m.classList.add('hidden')); }
let toastTimer = null;
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.add('hidden'), 2600);
}

/* ---------- 定时唤起 ---------- */
function checkTimer() {
  if (!settings.timerEnabled) return;
  const now = new Date();
  const [h, m] = settings.timerTime.split(':').map(Number);
  const key = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}-${h}:${m}`;
  if (now.getHours() === h && now.getMinutes() === m && now.getSeconds() < 30 && lastFired !== key) {
    lastFired = key;
    triggerTimer();
  }
}
function triggerTimer() {
  if (currentView !== 'kanban') switchView('kanban');
  toast(`⏰ ${settings.timerTime} 到点，已为你打开任务面板`);
  if (settings.notify && 'Notification' in window && Notification.permission === 'granted') {
    new Notification('四象限任务管理', { body: `${settings.timerTime} 到点，今日任务清单已就绪` });
  }
}
function syncSettings() {
  $('setTimerOn').checked = !!settings.timerEnabled;
  $('setTimerTime').value = settings.timerTime;
  $('setNotify').checked = !!settings.notify;
}

/* ---------- 视图切换 ---------- */
function switchView(v) {
  currentView = v;
  $('btnKanban').classList.toggle('active', v === 'kanban');
  $('btnList').classList.toggle('active', v === 'list');
  $('kanbanView').classList.toggle('hidden', v !== 'kanban');
  $('listView').classList.toggle('hidden', v !== 'list');
  render();
}

/* ---------- 事件绑定 ---------- */
function bind() {
  $('btnKanban').addEventListener('click', () => switchView('kanban'));
  $('btnList').addEventListener('click', () => switchView('list'));
  $('btnStats').addEventListener('click', renderStats);
  $('btnRecycle').addEventListener('click', renderRecycle);
  $('btnSettings').addEventListener('click', () => { syncSettings(); openModal('settingsModal'); });
  $('btnBackup').addEventListener('click', exportBackup);
  $('btnQuickAdd').addEventListener('click', () => { addTask($('quickAddInput').value, '', 4); $('quickAddInput').value = ''; render(); });
  $('quickAddInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { addTask(e.target.value, '', 4); e.target.value = ''; render(); } });
  $('searchBox').addEventListener('input', () => { if (currentView === 'list') renderList(); });
  $('filterSel').addEventListener('change', () => { if (currentView === 'list') renderList(); });
  $('editSave').addEventListener('click', saveEdit);
  document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', closeModals));
  document.querySelectorAll('.modal').forEach((m) => m.addEventListener('click', (e) => { if (e.target === m) closeModals(); }));

  $('setTimerOn').addEventListener('change', (e) => { settings.timerEnabled = e.target.checked; save(LS.settings, settings); toast(e.target.checked ? '定时唤起已开启' : '定时唤起已关闭'); });
  $('setTimerTime').addEventListener('change', (e) => { settings.timerTime = e.target.value; save(LS.settings, settings); });
  $('setNotify').addEventListener('change', (e) => {
    settings.notify = e.target.checked; save(LS.settings, settings);
    if (settings.notify && 'Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  });

  $('importFile').addEventListener('change', (e) => { if (e.target.files[0]) importBackup(e.target.files[0]); e.target.value = ''; });
  // 备份按钮长按/右键导入？这里直接用 prompt 选择：按住 Alt 点击导入
  $('btnBackup').addEventListener('contextmenu', (e) => { e.preventDefault(); $('importFile').click(); });
  $('btnBackup').title = '点击：导出备份 ｜ 右键：导入备份';

  // 键盘 Esc 关闭弹窗
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModals(); });
}

/* ---------- 初始化 ---------- */
function init() {
  bind();
  syncSettings();
  // 首次请求通知权限（若设置开启）
  if (settings.notify && 'Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  detectSync();
  render();
  setInterval(checkTimer, 1000);
}
init();

</script>
</body>
